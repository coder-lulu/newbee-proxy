syntax = "proto3";

package agent;

option go_package = "./agent";

// Agent服务定义 - 这是Agent对外提供的服务接口
service AgentService {
    // Agent注册到OPS服务 (一次性)
    rpc Register(RegisterRequest) returns (RegisterResponse);
    
    // 双向流通信 (持久连接)
    rpc Stream(stream AgentMessage) returns (stream OpsMessage);
    
    // 健康检查 (心跳)
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    
    // 任务状态查询
    rpc GetTaskStatus(TaskStatusRequest) returns (TaskStatusResponse);
    
    // 监控指标上报
    rpc ReportMetrics(MetricsRequest) returns (MetricsResponse);
}

// Agent注册请求
message RegisterRequest {
    string agent_id = 1;           // Agent唯一ID
    string version = 2;            // Agent版本
    string region = 3;             // 所在区域
    repeated string capabilities = 4; // 支持的协议能力 ["ssh", "telnet", "rdp", "ipmi", "snmp"]
    ResourceLimits resources = 5;   // 资源限制
    NetworkInfo network_info = 6;   // 网络信息
    map<string, string> metadata = 7; // 元数据
    string auth_token = 8;         // 认证令牌
}

// Agent注册响应
message RegisterResponse {
    bool success = 1;
    string message = 2;
    string agent_token = 3;        // OPS分配的令牌
    AgentConfig config = 4;        // 下发的配置
}

// 资源限制
message ResourceLimits {
    int32 max_concurrent_sessions = 1;  // 最大并发会话数
    int32 max_memory_mb = 2;           // 最大内存使用(MB)
    int32 max_cpu_percent = 3;         // 最大CPU使用率
    int32 session_timeout_seconds = 4; // 会话超时时间
}

// 网络信息
message NetworkInfo {
    string local_ip = 1;                    // 本地IP
    string public_ip = 2;                   // 公网IP
    repeated string network_segments = 3;   // 管理的网段
    map<string, int32> network_latency = 4; // 到各区域的延迟
}

// Agent配置
message AgentConfig {
    int32 heartbeat_interval_seconds = 1;   // 心跳间隔
    map<string, string> plugin_configs = 2; // 插件配置
    repeated string allowed_targets = 3;    // 允许访问的目标
    bool debug_mode = 4;                    // 调试模式
}

// Agent -> OPS 消息
message AgentMessage {
    string agent_id = 1;
    int64 timestamp = 2;
    string message_id = 3;
    
    oneof payload {
        HeartbeatData heartbeat = 4;
        TaskResult task_result = 5;
        ErrorReport error_report = 6;
        MetricsData metrics = 7;
        PluginStatus plugin_status = 8;
        ConnectionReport connection_report = 9;
    }
}

// OPS -> Agent 消息
message OpsMessage {
    string message_id = 1;
    int64 timestamp = 2;
    int32 priority = 3;              // 消息优先级 1=低 5=高
    
    oneof payload {
        TaskAssignment task = 4;
        ConfigUpdate config = 5;
        HealthCheck health_check = 6;
        PluginCommand plugin_cmd = 7;
        ShutdownCommand shutdown = 8;
        TunnelRequest tunnel_request = 9;
    }
}

// 心跳数据
message HeartbeatData {
    string status = 1;                      // online/offline/busy
    int32 active_sessions = 2;              // 活跃会话数
    float cpu_usage_percent = 3;            // CPU使用率
    float memory_usage_mb = 4;              // 内存使用量
    int64 uptime_seconds = 5;               // 运行时间
    map<string, string> plugin_status = 6; // 插件状态
}

// 任务结果
message TaskResult {
    string task_id = 1;
    string command_id = 2;
    TaskStatus status = 3;
    string result_data = 4;     // JSON格式的结果数据
    string error_message = 5;
    int64 execution_time_ms = 6;
    map<string, string> metadata = 7;
}

// 任务状态枚举
enum TaskStatus {
    TASK_PENDING = 0;
    TASK_RUNNING = 1;
    TASK_COMPLETED = 2;
    TASK_FAILED = 3;
    TASK_TIMEOUT = 4;
    TASK_CANCELLED = 5;
}

// 错误报告
message ErrorReport {
    string error_code = 1;
    string error_message = 2;
    string component = 3;       // 出错的组件
    string stack_trace = 4;
    map<string, string> context = 5;
}

// 监控指标数据
message MetricsData {
    int64 total_requests = 1;
    int64 successful_requests = 2;
    int64 failed_requests = 3;
    float average_response_time_ms = 4;
    int32 concurrent_sessions = 5;
    float throughput_mbps = 6;
    map<string, float> protocol_metrics = 7; // 各协议的指标
}

// 插件状态
message PluginStatus {
    string plugin_name = 1;
    string status = 2;          // loaded/unloaded/error
    string version = 3;
    string error_message = 4;
    map<string, string> config = 5;
}

// 连接报告
message ConnectionReport {
    string target = 1;
    string protocol = 2;        // ssh/telnet/rdp/ipmi/snmp
    bool connected = 3;
    int64 connection_time_ms = 4;
    string error_message = 5;
}

// 任务分配
message TaskAssignment {
    string task_id = 1;
    string command_id = 2;
    TaskType task_type = 3;
    string target = 4;          // 目标主机地址
    int32 target_port = 5;      // 目标端口
    Credentials credentials = 6; // 认证信息
    string payload = 7;         // 任务载荷(JSON)
    int32 timeout_seconds = 8;
    int32 priority = 9;
    map<string, string> options = 10;
}

// 任务类型枚举
enum TaskType {
    TUNNEL_CREATE = 0;          // 创建隧道
    TUNNEL_CLOSE = 1;           // 关闭隧道
    COMMAND_EXECUTE = 2;        // 执行命令
    HARDWARE_CONTROL = 3;       // 硬件控制
    NETWORK_PROBE = 4;          // 网络探测
    FILE_TRANSFER = 5;          // 文件传输
    SCRIPT_EXECUTE = 6;         // 脚本执行
}

// 认证信息
message Credentials {
    string username = 1;
    string password = 2;
    string private_key = 3;
    string public_key = 4;
    string auth_method = 5;     // password/publickey/none
    map<string, string> extra = 6;
}

// 配置更新
message ConfigUpdate {
    string config_version = 1;
    map<string, string> configs = 2;
    bool restart_required = 3;
}

// 健康检查
message HealthCheck {
    string check_id = 1;
    repeated string components = 2; // 要检查的组件
}

// 插件命令
message PluginCommand {
    string plugin_name = 1;
    string command = 2;         // load/unload/reload/configure
    map<string, string> parameters = 3;
}

// 关闭命令
message ShutdownCommand {
    string reason = 1;
    int32 grace_period_seconds = 2;
    bool force_shutdown = 3;
}

// 隧道请求
message TunnelRequest {
    string tunnel_id = 1;
    string protocol = 2;        // ssh/telnet/rdp
    string target_host = 3;
    int32 target_port = 4;
    Credentials credentials = 5;
    string session_id = 6;
    map<string, string> options = 7;
}

// 心跳请求
message HeartbeatRequest {
    string agent_id = 1;
    int64 timestamp = 2;
    MetricsData metrics = 3;
}

// 心跳响应
message HeartbeatResponse {
    bool success = 1;
    string message = 2;
    AgentConfig updated_config = 3;  // 如果有配置更新
}

// 任务状态请求
message TaskStatusRequest {
    string agent_id = 1;
    repeated string task_ids = 2;
}

// 任务状态响应
message TaskStatusResponse {
    repeated TaskResult task_results = 1;
}

// 监控指标请求
message MetricsRequest {
    string agent_id = 1;
    MetricsData metrics = 2;
}

// 监控指标响应
message MetricsResponse {
    bool success = 1;
    string message = 2;
} 