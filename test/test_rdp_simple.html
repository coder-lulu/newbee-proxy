<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDP客户端测试工具 - 基于Guacamole</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 350px;
            background: #2d2d30;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .toolbar {
            height: 50px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background: #1177bb;
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .btn.danger {
            background: #d13438;
        }

        .btn.danger:hover {
            background: #e04649;
        }

        .display-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: auto;
        }

        .display {
            outline: none;
            cursor: none;
        }

        .section {
            padding: 15px;
            border-bottom: 1px solid #3e3e42;
        }

        .section h3 {
            margin-bottom: 10px;
            color: #ffffff;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #cccccc;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background: #3c3c3c;
            border: 1px solid #5a5a5a;
            border-radius: 4px;
            color: #ffffff;
            font-size: 12px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0e639c;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-disconnected { background: #d13438; }
        .status-connecting { background: #ff9500; }
        .status-connected { background: #00d4aa; }

        .logs {
            height: 200px;
            overflow-y: auto;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 2px;
            word-wrap: break-word;
        }

        .log-info { color: #4fc3f7; }
        .log-success { color: #81c784; }
        .log-warning { color: #ffb74d; }
        .log-error { color: #e57373; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 11px;
        }

        .stat-item {
            background: #3c3c3c;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #00d4aa;
        }

        .stat-label {
            color: #cccccc;
            margin-top: 2px;
        }

        .connection-info {
            background: #2d2d30;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3e3e42;
            border-top: 4px solid #0e639c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        /* Guacamole Display 样式 */
        .guac-display {
            position: relative;
            overflow: hidden;
        }

        .guac-display > * {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <!-- 连接配置 -->
            <div class="section">
                <h3>🔧 连接配置</h3>
                <div class="form-group">
                    <label>服务器地址</label>
                    <input type="text" id="serverHost" value="192.168.26.140" placeholder="IP地址">
                </div>
                <div class="form-group">
                    <label>端口</label>
                    <input type="number" id="serverPort" value="3389" placeholder="3389">
                </div>
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" value="work" placeholder="用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" value="931214" placeholder="密码">
        </div>
                <div class="form-group">
                    <label>分辨率</label>
                    <select id="resolution">
                        <option value="1920x1080">1920x1080</option>
                        <option value="1366x768">1366x768</option>
                        <option value="1280x720">1280x720</option>
                        <option value="1024x768">1024x768</option>
                    </select>
        </div>
                <button class="btn" id="connectBtn" onclick="connect()">🔌 连接</button>
                <button class="btn danger" id="disconnectBtn" onclick="disconnect()" disabled>🔌 断开</button>
            </div>

            <!-- 连接状态 -->
            <div class="section">
                <h3>📊 连接状态</h3>
                <div class="connection-info">
                    <div id="connectionStatus">
                        <span class="status-indicator status-disconnected"></span>
                        <span id="statusText">未连接</span>
                    </div>
                    <div id="connectionDetails" style="margin-top: 8px; color: #888;"></div>
                </div>
            </div>

            <!-- 统计信息 -->
            <div class="section">
                <h3>📈 统计信息</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="statFrames">0</div>
                        <div class="stat-label">帧数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statInstructions">0</div>
                        <div class="stat-label">指令数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statBytes">0</div>
                        <div class="stat-label">字节数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statLatency">0ms</div>
                        <div class="stat-label">延迟</div>
                    </div>
                </div>
            </div>

            <!-- 日志 -->
            <div class="section" style="flex: 1; display: flex; flex-direction: column;">
                <h3>📝 连接日志</h3>
                <div class="logs" id="logContainer"></div>
                <button class="btn" onclick="clearLogs()" style="margin-top: 10px;">清空日志</button>
            </div>
        </div>
        
        <!-- 主显示区域 -->
        <div class="main-content">
            <!-- 工具栏 -->
            <div class="toolbar">
                <button class="btn" onclick="sendCtrlAltDel()" disabled id="ctrlAltDelBtn">Ctrl+Alt+Del</button>
                <button class="btn" onclick="toggleFullscreen()" disabled id="fullscreenBtn">全屏</button>
                <button class="btn" onclick="takeScreenshot()" disabled id="screenshotBtn">截图</button>
                <button class="btn" onclick="refreshConnection()" disabled id="refreshBtn">刷新</button>
                <div style="flex: 1;"></div>
                <span id="displayInfo" style="font-size: 12px; color: #ccc;"></span>
            </div>

            <!-- 显示区域 -->
            <div class="display-area">
                <div class="viewport" id="viewport">
                    <div class="display" id="display" tabindex="0"></div>
                </div>
                
                <!-- 加载遮罩 -->
                <div class="loading-overlay hidden" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <div>正在连接到远程桌面...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入Guacamole库 -->
    <script src="guacamole-common.js"></script>

    <script>
        // 全局变量
        let client = null;
        let display = null;
        let tunnel = null;
        let keyboard = null;
        let mouse = null;
        let isConnected = false;
        let stats = {
            frames: 0,
            instructions: 0,
            bytes: 0,
            startTime: null
        };

        // DOM元素
        const elements = {
            connectBtn: document.getElementById('connectBtn'),
            disconnectBtn: document.getElementById('disconnectBtn'),
            statusText: document.getElementById('statusText'),
            connectionStatus: document.getElementById('connectionStatus'),
            connectionDetails: document.getElementById('connectionDetails'),
            displayInfo: document.getElementById('displayInfo'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            logContainer: document.getElementById('logContainer'),
            viewport: document.getElementById('viewport'),
            displayElement: document.getElementById('display'),
            ctrlAltDelBtn: document.getElementById('ctrlAltDelBtn'),
            fullscreenBtn: document.getElementById('fullscreenBtn'),
            screenshotBtn: document.getElementById('screenshotBtn'),
            refreshBtn: document.getElementById('refreshBtn')
        };

        // 日志函数
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            
            elements.logContainer.appendChild(logEntry);
            elements.logContainer.scrollTop = elements.logContainer.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLogs() {
            elements.logContainer.innerHTML = '';
        }

        // 更新状态
        function updateStatus(status, details = '') {
            const statusIndicator = elements.connectionStatus.querySelector('.status-indicator');
            statusIndicator.className = `status-indicator status-${status}`;
            
            const statusTexts = {
                'disconnected': '未连接',
                'connecting': '连接中...',
                'connected': '已连接'
            };
            
            elements.statusText.textContent = statusTexts[status] || status;
            elements.connectionDetails.textContent = details;
            
            // 更新按钮状态
            const connected = status === 'connected';
            elements.connectBtn.disabled = connected;
            elements.disconnectBtn.disabled = !connected;
            elements.ctrlAltDelBtn.disabled = !connected;
            elements.fullscreenBtn.disabled = !connected;
            elements.screenshotBtn.disabled = !connected;
            elements.refreshBtn.disabled = !connected;
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('statFrames').textContent = stats.frames;
            document.getElementById('statInstructions').textContent = stats.instructions;
            document.getElementById('statBytes').textContent = formatBytes(stats.bytes);
            
            if (stats.startTime) {
                const elapsed = Date.now() - stats.startTime;
                document.getElementById('statLatency').textContent = `${elapsed}ms`;
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 连接函数
        function connect() {
            const config = {
                hostname: document.getElementById('serverHost').value,
                port: document.getElementById('serverPort').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                resolution: document.getElementById('resolution').value
            };

            if (!config.hostname || !config.username || !config.password) {
                log('请填写完整的连接信息', 'error');
                return;
            }
            
            log(`开始连接到 ${config.hostname}:${config.port}`, 'info');
            updateStatus('connecting', `${config.hostname}:${config.port}`);
            elements.loadingOverlay.classList.remove('hidden');

            // 重置统计
            stats = {
                frames: 0,
                instructions: 0,
                bytes: 0,
                startTime: Date.now()
            };

            try {
                // 创建WebSocket隧道 - 使用标准Guacamole端点
                const wsUrl = `ws://localhost:8889/api/rdp/guacamole`;
                tunnel = new Guacamole.WebSocketTunnel(wsUrl);

                // 创建客户端
                client = new Guacamole.Client(tunnel);

                // 设置隧道事件处理
                tunnel.onerror = function(status) {
                    log(`隧道错误: ${status.message || status}`, 'error');
                    handleConnectionError();
                };

                tunnel.onstatechange = function(state) {
                    log(`隧道状态变化: ${state}`, 'info');
                    
                    switch(state) {
                        case Guacamole.Tunnel.State.CONNECTING:
                            log('正在建立WebSocket连接...', 'info');
                            break;
                        case Guacamole.Tunnel.State.OPEN:
                            log('WebSocket连接已建立', 'success');
                            break;
                        case Guacamole.Tunnel.State.CLOSED:
                            log('WebSocket连接已关闭', 'warning');
                            handleConnectionError();
                            break;
                        case Guacamole.Tunnel.State.UNSTABLE:
                            log('连接不稳定', 'warning');
                            break;
                    }
                };

                // 设置客户端事件处理
                client.onstatechange = function(state) {
                    log(`客户端状态变化: ${state}`, 'info');
                    
                    switch(state) {
                        case Guacamole.Client.State.IDLE:
                            log('客户端空闲', 'info');
                            break;
                        case Guacamole.Client.State.CONNECTING:
                            log('正在连接到RDP服务器...', 'info');
                            break;
                        case Guacamole.Client.State.WAITING:
                            log('等待服务器响应...', 'info');
                            break;
                        case Guacamole.Client.State.CONNECTED:
                            log('RDP连接成功!', 'success');
                            handleConnectionSuccess(config);
                            break;
                        case Guacamole.Client.State.DISCONNECTING:
                            log('正在断开连接...', 'info');
                            break;
                        case Guacamole.Client.State.DISCONNECTED:
                            log('RDP连接已断开', 'warning');
                            handleConnectionError();
                            break;
                    }
                };

                client.onerror = function(error) {
                    log(`客户端错误: ${error.message || error}`, 'error');
                    handleConnectionError();
                };

                // 设置指令处理
                client.onsync = function(timestamp) {
                    // 处理同步指令
                    stats.instructions++;
                    updateStats();
                };

                // 初始化显示
                setupDisplay();

                // 构建连接参数
                const [width, height] = config.resolution.split('x').map(Number);
                const connectData = `hostname=${encodeURIComponent(config.hostname)}&` +
                                  `port=${encodeURIComponent(config.port)}&` +
                                  `username=${encodeURIComponent(config.username)}&` +
                                  `password=${encodeURIComponent(config.password)}&` +
                                  `width=${width}&height=${height}&` +
                                  `dpi=96&color-depth=32`;

                // 开始连接
                client.connect(connectData);

            } catch (error) {
                log(`连接失败: ${error.message}`, 'error');
                handleConnectionError();
            }
        }

        // 设置显示
        function setupDisplay() {
            // 获取显示对象
            display = client.getDisplay();
            
            // 增强图像显示处理 - 修复根据用户规则中提到的问题
            const originalInstructionHandlers = client.getInstructionHandlers ? client.getInstructionHandlers() : null;
            
            // 屏幕状态跟踪
            let screenInitialized = false;
            let pendingImages = new Map();
            let mainScreenWidth = 0;
            let mainScreenHeight = 0;
            
            // 重写img指令处理器以修复图像显示问题
            if (client.getInstructionHandlers) {
                const handlers = client.getInstructionHandlers();
                const originalImgHandler = handlers.img;
                
                handlers.img = function(parameters) {
                    try {
                        // 安全解析参数，避免NaN
                        const streamIndex = parseInt(parameters[0]) || 0;
                        const channelMask = parseInt(parameters[1]) || 0;
                        const layerIndex = parseInt(parameters[2]) || 0;
                        const mimetype = parameters[3] || 'image/png';
                        const x = parseInt(parameters[4]) || 0;
                        const y = parseInt(parameters[5]) || 0;
                        
                        log(`🖼️ 图像指令: stream=${streamIndex}, layer=${layerIndex}, pos=(${x},${y}), type=${mimetype}`, 'info');
                        
                        // 区分主屏幕图像和光标图像
                        // 光标图像通常是小尺寸且在特殊层
                        const isCursorImage = layerIndex > 0 && (
                            Math.abs(x) > mainScreenWidth || 
                            Math.abs(y) > mainScreenHeight ||
                            mimetype.includes('cursor')
                        );
                        
                        // 如果是主屏幕图像且屏幕尚未初始化，等待size指令
                        if (!screenInitialized && !isCursorImage && layerIndex === 0) {
                            log(`⏳ 等待屏幕初始化完成后处理图像`, 'warning');
                            pendingImages.set(streamIndex, {
                                parameters: parameters,
                                timestamp: Date.now()
                            });
                            return;
                        }
                        
                        // 处理大尺寸主屏幕图像
                        if (!isCursorImage) {
                            log(`🖥️ 处理主屏幕图像: ${x},${y}`, 'success');
                        }
                        
                        // 调用原始处理器
                        if (originalImgHandler) {
                            originalImgHandler.call(this, parameters);
                        }
                        
                    } catch (error) {
                        log(`❌ 图像处理错误: ${error.message}`, 'error');
                    }
                };
                
                // 重写size指令处理器
                const originalSizeHandler = handlers.size;
                handlers.size = function(parameters) {
                    try {
                        const layerIndex = parseInt(parameters[0]) || 0;
                        const width = parseInt(parameters[1]) || 0;
                        const height = parseInt(parameters[2]) || 0;
                        
                        log(`📐 尺寸指令: layer=${layerIndex}, size=${width}x${height}`, 'info');
                        
                        // 主屏幕尺寸设置
                        if (layerIndex === 0 && width > 0 && height > 0) {
                            mainScreenWidth = width;
                            mainScreenHeight = height;
                            screenInitialized = true;
                            
                            log(`✅ 主屏幕初始化完成: ${width}x${height}`, 'success');
                            
                            // 处理等待的图像
                            const now = Date.now();
                            for (const [streamIndex, imageData] of pendingImages.entries()) {
                                // 检查是否超时（超过5秒的图像数据丢弃）
                                if (now - imageData.timestamp < 5000) {
                                    log(`🔄 处理等待的图像: stream=${streamIndex}`, 'info');
                                    handlers.img.call(this, imageData.parameters);
                                } else {
                                    log(`⏰ 丢弃超时图像: stream=${streamIndex}`, 'warning');
                                }
                            }
                            pendingImages.clear();
                        }
                        
                        // 调用原始处理器
                        if (originalSizeHandler) {
                            originalSizeHandler.call(this, parameters);
                        }
                        
                    } catch (error) {
                        log(`❌ 尺寸处理错误: ${error.message}`, 'error');
                    }
                };
                
                // 重写blob指令处理器以确保base64数据完整性
                const originalBlobHandler = handlers.blob;
                const blobBuffers = new Map();
                
                handlers.blob = function(parameters) {
                    try {
                        const streamIndex = parseInt(parameters[0]) || 0;
                        const data = parameters[1] || '';
                        
                        // 收集base64数据片段
                        if (!blobBuffers.has(streamIndex)) {
                            blobBuffers.set(streamIndex, []);
                        }
                        
                        blobBuffers.get(streamIndex).push(data);
                        log(`📦 收集图像数据片段: stream=${streamIndex}, size=${data.length}`, 'data');
                        
                        // 调用原始处理器
                        if (originalBlobHandler) {
                            originalBlobHandler.call(this, parameters);
                        }
                        
                    } catch (error) {
                        log(`❌ 数据块处理错误: ${error.message}`, 'error');
                    }
                };
                
                // 重写end指令处理器以验证数据完整性
                const originalEndHandler = handlers.end;
                handlers.end = function(parameters) {
                    try {
                        const streamIndex = parseInt(parameters[0]) || 0;
                        
                        // 检查并清理对应的数据缓冲
                        if (blobBuffers.has(streamIndex)) {
                            const chunks = blobBuffers.get(streamIndex);
                            const totalSize = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
                            log(`✅ 图像数据收集完成: stream=${streamIndex}, 总大小=${totalSize}`, 'success');
                            blobBuffers.delete(streamIndex);
                        }
                        
                        // 调用原始处理器
                        if (originalEndHandler) {
                            originalEndHandler.call(this, parameters);
                        }
                        
                    } catch (error) {
                        log(`❌ 结束处理错误: ${error.message}`, 'error');
                    }
                };
                
                log('✅ 图像显示优化已启用', 'success');
            }
            
            // 将显示元素添加到DOM
            const displayElement = display.getElement();
            elements.displayElement.innerHTML = '';
            elements.displayElement.appendChild(displayElement);

            // 监听显示尺寸变化
            display.onresize = function(width, height) {
                log(`📐 显示尺寸变化: ${width}x${height}`, 'info');
                mainScreenWidth = width;
                mainScreenHeight = height;
                
                // 更新显示区域样式
                elements.displayElement.style.width = width + 'px';
                elements.displayElement.style.height = height + 'px';
            };

            // 设置键盘
            keyboard = new Guacamole.Keyboard(elements.displayElement);
            keyboard.onkeydown = function(keysym) {
                client.sendKeyEvent(1, keysym);
            };
            keyboard.onkeyup = function(keysym) {
                client.sendKeyEvent(0, keysym);
            };

            // 设置鼠标
            mouse = new Guacamole.Mouse(elements.displayElement);
            mouse.onmousedown = mouse.onmouseup = mouse.onmousemove = function(mouseState) {
                client.sendMouseState(mouseState);
            };

            // 设置焦点
            elements.displayElement.onclick = function() {
                elements.displayElement.focus();
            };

            elements.displayElement.onfocus = function() {
                elements.displayElement.style.outline = '2px solid #0e639c';
            };

            elements.displayElement.onblur = function() {
                elements.displayElement.style.outline = 'none';
            };

            log('✅ 显示系统初始化完成（已优化图像处理）', 'success');
        }

        // 连接成功处理
        function handleConnectionSuccess(config) {
            isConnected = true;
            updateStatus('connected', `${config.hostname}:${config.port} (${config.resolution})`);
            elements.loadingOverlay.classList.add('hidden');
            
            // 更新显示信息
            const [width, height] = config.resolution.split('x').map(Number);
            elements.displayInfo.textContent = `${width}x${height} @ ${config.hostname}`;
            
            // 设置定期更新统计
            setInterval(updateStats, 1000);
            
            log(`连接建立成功 - 分辨率: ${config.resolution}`, 'success');
        }

        // 连接错误处理
        function handleConnectionError() {
            isConnected = false;
            updateStatus('disconnected');
            elements.loadingOverlay.classList.add('hidden');
            elements.displayInfo.textContent = '';
            
            // 清理资源
            if (client) {
                try {
                    client.disconnect();
                    } catch (e) {
                    // 忽略断开连接时的错误
                }
                client = null;
            }
            
            if (tunnel) {
                try {
                    tunnel.disconnect();
                } catch (e) {
                    // 忽略断开连接时的错误
                }
                tunnel = null;
            }
            
            display = null;
            keyboard = null;
            mouse = null;
        }

        // 断开连接
        function disconnect() {
            if (client) {
                log('正在断开连接...', 'info');
                client.disconnect();
            }
        }

        // 发送Ctrl+Alt+Del
        function sendCtrlAltDel() {
            if (client && isConnected) {
                log('发送 Ctrl+Alt+Del', 'info');
                client.sendKeyEvent(1, 0xFFE3); // Ctrl
                client.sendKeyEvent(1, 0xFFE9); // Alt  
                client.sendKeyEvent(1, 0xFFFF); // Delete
                client.sendKeyEvent(0, 0xFFFF); // Delete up
                client.sendKeyEvent(0, 0xFFE9); // Alt up
                client.sendKeyEvent(0, 0xFFE3); // Ctrl up
            }
        }

        // 切换全屏
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                elements.viewport.requestFullscreen().catch(err => {
                    log(`全屏失败: ${err.message}`, 'error');
                });
            } else {
                document.exitFullscreen();
            }
        }

        // 截图
        function takeScreenshot() {
            if (display) {
                try {
                    const canvas = display.flatten();
                    const link = document.createElement('a');
                    link.download = `rdp_screenshot_${new Date().getTime()}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    log('截图已保存', 'success');
                } catch (error) {
                    log(`截图失败: ${error.message}`, 'error');
                }
            }
        }

        // 刷新连接
        function refreshConnection() {
            if (isConnected) {
                disconnect();
                setTimeout(() => {
                    connect();
                }, 1000);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('RDP客户端测试工具已加载', 'success');
            updateStatus('disconnected');
            
            // 设置窗口关闭时断开连接
            window.addEventListener('beforeunload', function() {
                if (client) {
                    client.disconnect();
                }
            });
            
            // 设置全屏事件监听
            document.addEventListener('fullscreenchange', function() {
                const btn = elements.fullscreenBtn;
                btn.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
            });
        });
    </script>
</body>
</html>
